name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        working-directory: compose
        run: |
          printf 'JWT_SECRET=x\nJWT_ISSUER=ecommerce-auth\nPOSTGRES_PASSWORD=x\n' > .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.ci.yml config -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          additional_files: "*.sh"
