# Local, offline stack for the ar-ecommerce-platform.
#
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#   docker compose -f infra/compose/docker-compose.yml ps
#   docker compose -f infra/compose/docker-compose.yml down
#
# Every service also runs standalone (see infra/scripts/run-local.ps1); Docker is
# the supported path. Databases are in-memory H2 - data resets on restart.

name: ecom

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [ecom]
  environment: &common-env
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    CONFIG_SERVER_URL: http://config-server:8888
    SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  depends_on:
    discovery-server:
      condition: service_healthy
    config-server:
      condition: service_healthy

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

networks:
  ecom:
    driver: bridge

services:
  discovery-server:
    build: { context: ../../discovery-server }
    image: ecom/discovery-server
    container_name: discovery-server
    restart: unless-stopped
    networks: [ecom]
    ports: ["127.0.0.1:8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      <<: *healthcheck
      start_period: 40s

  config-server:
    build: { context: ../../config-server }
    image: ecom/config-server
    container_name: config-server
    restart: unless-stopped
    networks: [ecom]
    ports: ["127.0.0.1:8888:8888"]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      CONFIG_REPO_LOCATIONS: file:/config-repo,file:/config-repo/{application}
    volumes:
      - ../../config-repo:/config-repo:ro
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      <<: *healthcheck

  auth-service:
    <<: *service-defaults
    build: { context: ../../auth-service }
    image: ecom/auth-service
    container_name: auth-service
    ports: ["127.0.0.1:8081:8081"]
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/compose/.env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-auth}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      <<: *healthcheck

  user-service:
    <<: *service-defaults
    build: { context: ../../user-service }
    image: ecom/user-service
    container_name: user-service
    ports: ["127.0.0.1:8087:8087"]
    environment:
      <<: *common-env
      SERVER_PORT: 8087
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      <<: *healthcheck

  product-service:
    <<: *service-defaults
    build: { context: ../../product-service }
    image: ecom/product-service
    container_name: product-service
    ports: ["127.0.0.1:8083:8083"]
    environment:
      <<: *common-env
      SERVER_PORT: 8083
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      <<: *healthcheck

  inventory-service:
    <<: *service-defaults
    build: { context: ../../inventory-service }
    image: ecom/inventory-service
    container_name: inventory-service
    ports: ["127.0.0.1:8084:8084"]
    environment:
      <<: *common-env
      SERVER_PORT: 8084
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      <<: *healthcheck

  payment-service:
    <<: *service-defaults
    build: { context: ../../payment-service }
    image: ecom/payment-service
    container_name: payment-service
    ports: ["127.0.0.1:8085:8085"]
    environment:
      <<: *common-env
      SERVER_PORT: 8085
      PAYMENT_AUTO_DECLINE_ABOVE_CENTS: ${PAYMENT_AUTO_DECLINE_ABOVE_CENTS:-500000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      <<: *healthcheck

  notification-service:
    <<: *service-defaults
    build: { context: ../../notification-service }
    image: ecom/notification-service
    container_name: notification-service
    ports: ["127.0.0.1:8086:8086"]
    environment:
      <<: *common-env
      SERVER_PORT: 8086
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      <<: *healthcheck

  order-service:
    <<: *service-defaults
    build: { context: ../../order-service }
    image: ecom/order-service
    container_name: order-service
    ports: ["127.0.0.1:8082:8082"]
    environment:
      <<: *common-env
      SERVER_PORT: 8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      <<: *healthcheck

  api-gateway:
    build: { context: ../../api-gateway }
    image: ecom/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    networks: [ecom]
    ports: ["8080:8080"]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/compose/.env}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-auth}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      user-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      <<: *healthcheck
