# CI overlay: run the stack from published GHCR images instead of building
# locally. Used by the e2e workflow.
#
#   IMAGE_TAG=<sha> docker compose \
#     -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.ci.yml up -d

name: ecom

x-img: &img
  build: !reset null
  pull_policy: always

services:
  discovery-server:     { <<: *img, image: "ghcr.io/ar-ecommerce-platform/discovery-server:${IMAGE_TAG:-main}" }
  config-server:        { <<: *img, image: "ghcr.io/ar-ecommerce-platform/config-server:${IMAGE_TAG:-main}" }
  # E2E and its readiness loop hit login/register far more than 10x a minute from one IP.
  api-gateway:          { <<: *img, image: "ghcr.io/ar-ecommerce-platform/api-gateway:${IMAGE_TAG:-main}", environment: { SECURITY_AUTH_RATE_LIMIT_PER_MINUTE: "1000" } }
  auth-service:         { <<: *img, image: "ghcr.io/ar-ecommerce-platform/auth-service:${IMAGE_TAG:-main}" }
  user-service:         { <<: *img, image: "ghcr.io/ar-ecommerce-platform/user-service:${IMAGE_TAG:-main}" }
  product-service:      { <<: *img, image: "ghcr.io/ar-ecommerce-platform/product-service:${IMAGE_TAG:-main}" }
  inventory-service:    { <<: *img, image: "ghcr.io/ar-ecommerce-platform/inventory-service:${IMAGE_TAG:-main}" }
  order-service:        { <<: *img, image: "ghcr.io/ar-ecommerce-platform/order-service:${IMAGE_TAG:-main}" }
  payment-service:      { <<: *img, image: "ghcr.io/ar-ecommerce-platform/payment-service:${IMAGE_TAG:-main}" }
  notification-service: { <<: *img, image: "ghcr.io/ar-ecommerce-platform/notification-service:${IMAGE_TAG:-main}" }
